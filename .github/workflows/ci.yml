name: Validate TogetherWatch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node --check auth.js
      - run: node --check public/app.js
      - run: node --check public/i18n.js
      - name: Validate Docker Compose configuration
        run: BROWSER_TOKEN=ci-browser-token POSTGRES_PASSWORD=ci-postgres-password docker compose config --quiet
      - name: Smoke test HTTP server
        run: |
          npm start > /tmp/togetherwatch.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/health && curl --fail --silent http://127.0.0.1:3000/api/auth/me | grep -q '"ok":true'; then exit 0; fi
            sleep 1
          done
          cat /tmp/togetherwatch.log
          exit 1
