name: Validate TogetherWatch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node --check public/app.js
      - run: node -e "const p=require('./package.json'); if(!p.scripts.start || !p.dependencies.express || !p.dependencies['socket.io']) process.exit(1)"
