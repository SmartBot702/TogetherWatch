services:
  togetherwatch:
    build: .
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - togetherwatch_uploads:/app/.data/uploads
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgres://togetherwatch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/togetherwatch"
      DATABASE_SSL: "disable"
      BROWSER_WS_ENDPOINT: "ws://browserless:3000?token=${BROWSER_TOKEN:?Set BROWSER_TOKEN in .env}"
    depends_on:
      db:
        condition: service_healthy
      browserless:
        condition: service_started
    networks:
      - app_net
      - data_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  browserless:
    image: browserless/chromium:latest
    environment:
      TOKEN: "${BROWSER_TOKEN:?Set BROWSER_TOKEN in .env}"
      MAX_CONCURRENT_SESSIONS: "5"
      CONNECTION_TIMEOUT: "60000"
    expose:
      - "3000"
    shm_size: "1gb"
    networks:
      - app_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: togetherwatch
      POSTGRES_DB: togetherwatch
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U togetherwatch -d togetherwatch"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - togetherwatch
    networks:
      - app_net
    restart: unless-stopped

networks:
  app_net:
  data_net:
    internal: true

volumes:
  postgres_data:
  togetherwatch_uploads:
  caddy_data:
  caddy_config:
